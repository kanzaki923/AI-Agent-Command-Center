[package]
name = "acc-desktop"
version = "0.1.3"
description = "AI Agent Command Center desktop shell"
edition = "2021"
rust-version = "1.89"
# MSRV-aware resolution: pick the newest deps that still build on rust-version
resolver = "3"
publish = false

[lib]
# desktop only: rlib is enough (staticlib/cdylib are for mobile targets)
name = "acc_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: the app stays in the notification area while the window is closed (src/tray.rs)
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# OS notifications for approvals, failures, ready integrations (lib/notify.ts invokes its commands)
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# resource_dir() returns a verbatim \\?\C:\ path on Windows; Node 22.23 fails to start an
# entry script given that way (EISDIR on lstat 'C:'), so paths handed to node go through dunce.
dunce = "1"
# Window material behind the UI (acrylic / mica on Windows, vibrancy on macOS): ui-rework spec §1.3
window-vibrancy = "0.6"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
